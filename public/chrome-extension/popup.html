<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ScapRecord Extension</title>
    <style>
      body {
        width: 320px;
        margin: 0;
        padding: 16px;
        background: #020617;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
        padding-bottom: 10px;
        border-bottom: 1px solid #1e293b;
      }
      .brand {
        font-weight: 700;
        font-size: 15px;
        color: #f8fafc;
      }
      .site {
        font-size: 11px;
        color: #f59e0b;
      }
      label {
        display: block;
        font-size: 12px;
        color: #94a3b8;
        margin-bottom: 6px;
      }
      select {
        width: 100%;
        padding: 8px 10px;
        background: #0f172a;
        color: #f8fafc;
        border: 1px solid #334155;
        border-radius: 6px;
        margin-bottom: 12px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
        font-size: 12px;
      }
      .btn {
        width: 100%;
        padding: 10px 14px;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
      }
      .btn-start {
        background: #f59e0b;
        color: #020617;
      }
      .btn-stop {
        background: #ef4444;
        color: #ffffff;
        display: none;
      }
      .status {
        margin-top: 10px;
        font-size: 11px;
        color: #94a3b8;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <span class="brand">ScapRecord</span>
      <span class="site">scaprecord.site</span>
    </div>
    <label for="scap-mode-select">Capture Mode</label>
    <select id="scap-mode-select">
      <option value="screen_cam">Screen + Camera Bubble</option>
      <option value="screen_only">Full Screen / Tab Only</option>
      <option value="cam_only">Camera Only</option>
    </select>
    <div class="row">
      <span>Auto-Sync & Share via Google Drive</span>
      <input type="checkbox" id="scap-drive-toggle" checked />
    </div>
    <button id="scap-start-btn" class="btn btn-start">Start Recording</button>
    <button id="scap-stop-btn" class="btn btn-stop">Stop & Upload to Drive</button>
    <div id="scap-status-label" class="status">Ready to record to Google Drive</div>
    <script src="popup.js"></script>
  </body>
</html>
